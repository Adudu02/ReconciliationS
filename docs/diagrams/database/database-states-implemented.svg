<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="940" viewBox="0 0 1300 940" font-family="Liberation Sans, Arial, sans-serif">
<rect width="1300" height="940" fill="#fff"/>
<text x="650.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Status and lifecycle rules of the data</text>
<text x="650.0" y="54" text-anchor="middle" font-size="12.5" fill="#555">import_file.status · auth_session / refresh_token</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="18" y="78" width="1264" height="400" rx="10" fill="#dcfce7" fill-opacity="0.35" stroke="#15803d" stroke-dasharray="6 4"/>
<text x="30" y="98" font-size="13.5" font-weight="bold" fill="#15803d">import_file.status</text>
<circle cx="70" cy="250" r="9" fill="#111"/>
<text x="70" y="278" text-anchor="middle" font-size="11" fill="#222">upload received</text>
<rect x="170" y="200" width="300" height="100" rx="10" fill="#fff7e6" stroke="#c77c00" stroke-width="2" stroke-dasharray="6 4"/>
<text x="320.0" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">importing</text>
<text x="320.0" y="240" text-anchor="middle" font-size="11" fill="#444">transient: lives only inside the transaction,</text>
<text x="320.0" y="254" text-anchor="middle" font-size="11" fill="#444">never committed</text>
<path d="M80 250 L170 250" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="900" y="110" width="230" height="66" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1015.0" y="148.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">imported</text>
<rect x="900" y="215" width="230" height="66" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1015.0" y="253.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">rejected</text>
<rect x="900" y="320" width="230" height="66" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="1015.0" y="358.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">already_imported</text>
<path d="M470 225 L600 225 L600 143 L900 143" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="610" y="118" font-size="11" fill="#222" text-anchor="start">valid CFDI or CSV</text>
<text x="610" y="132" font-size="11" fill="#222" text-anchor="start">original + sha256 stored, retained_until set</text>
<path d="M470 250 L900 250" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="610" y="228" font-size="11" fill="#222" text-anchor="start">invalid, hostile or not the company's</text>
<text x="610" y="242" font-size="11" fill="#222" text-anchor="start">hash kept, bytes not kept</text>
<path d="M470 275 L600 275 L600 353 L900 353" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="610" y="328" font-size="11" fill="#222" text-anchor="start">UUID already imported</text>
<text x="610" y="342" font-size="11" fill="#222" text-anchor="start">original_file_id points to the first file</text>
<text x="36" y="420" font-size="12" fill="#222">Once committed: original, sha256 and retention cannot change or shrink (trigger preserve_import_original).</text>
<text x="36" y="440" font-size="12" fill="#222">No DELETE privilege and no DELETE route exist.</text>
<rect x="18" y="500" width="1264" height="420" rx="10" fill="#ede9fe" fill-opacity="0.35" stroke="#6d28d9" stroke-dasharray="6 4"/>
<text x="30" y="520" font-size="13.5" font-weight="bold" fill="#6d28d9">Session and refresh token</text>
<circle cx="60" cy="590" r="9" fill="#111"/>
<text x="60" y="618" text-anchor="middle" font-size="11" fill="#222">login</text>
<rect x="130" y="540" width="190" height="110" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="225.0" y="562" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Active</text>
<text x="225.0" y="580" text-anchor="middle" font-size="11" fill="#444">revoked_at is NULL</text>
<path d="M69 590 L130 590" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="700" y="540" width="250" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="825.0" y="575.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Expired</text>
<rect x="700" y="610" width="250" height="60" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="825.0" y="645.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Revoked</text>
<path d="M320 570 L700 570" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="335" y="560" font-size="11" fill="#222" text-anchor="start">idle 8 h or absolute 30 days (computed, not stored)</text>
<path d="M320 640 L700 640" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="335" y="630" font-size="11" fill="#222" text-anchor="start">logout, password_changed, reuse_detected</text>
<rect x="130" y="780" width="230" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="245.0" y="802" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Current token</text>
<text x="245.0" y="820" text-anchor="middle" font-size="11" fill="#444">rotated_at is NULL</text>
<rect x="700" y="780" width="250" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="825.0" y="802" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Rotated token</text>
<text x="825.0" y="820" text-anchor="middle" font-size="11" fill="#444">rotated_at set, replaced_by = new token</text>
<path d="M360 815 L700 815" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="375" y="805" font-size="11" fill="#222" text-anchor="start">POST /auth/refresh: rotate</text>
<path d="M950 800 L990 800 L990 835 L950 835" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="700" y="878" font-size="11" fill="#222">presented again within the grace window (10 s): 409, nothing changes</text>
<path d="M825 780 L825 672" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="837" y="735" font-size="11" fill="#b91c1c">presented again after the grace window: session revoked</text>
</svg>