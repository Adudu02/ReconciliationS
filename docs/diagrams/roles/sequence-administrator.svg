<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family="Liberation Sans, Arial, sans-serif">
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/></marker>
<marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e67e22"/></marker>
</defs>
<rect width="1200" height="790" fill="#fff"/>
<text x="600" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Administrator: manage users, settings and failed jobs</text>
<text x="600" y="58" text-anchor="middle" font-size="12.5" fill="#555">Red = endpoint added in the fiscal-rule review · Orange = method changed · Dashed = response</text>
<rect x="70" y="72" width="160" height="34" rx="6" fill="#e4eefb" stroke="#333" stroke-width="1.3"/>
<text x="150" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Administrator</text>
<line x1="150" y1="106" x2="150" y2="760" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="370" y="72" width="160" height="34" rx="6" fill="#e4eefb" stroke="#333" stroke-width="1.3"/>
<text x="450" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">API</text>
<line x1="450" y1="106" x2="450" y2="760" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="670" y="72" width="160" height="34" rx="6" fill="#e4eefb" stroke="#333" stroke-width="1.3"/>
<text x="750" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">PostgreSQL</text>
<line x1="750" y1="106" x2="750" y2="760" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="970" y="72" width="160" height="34" rx="6" fill="#e4eefb" stroke="#333" stroke-width="1.3"/>
<text x="1050" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Worker</text>
<line x1="1050" y1="106" x2="1050" y2="760" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="150" y1="142" x2="450" y2="142" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="300.0" y="136" text-anchor="middle" font-size="12" fill="#222">GET /jobs?status=failed</text>
<line x1="450" y1="176" x2="750" y2="176" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="600.0" y="170" text-anchor="middle" font-size="12" fill="#222">read failed jobs (company context)</text>
<line x1="450" y1="210" x2="150" y2="210" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="300.0" y="204" text-anchor="middle" font-size="12" fill="#222">200: jobs with input and error</text>
<line x1="150" y1="244" x2="450" y2="244" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="300.0" y="238" text-anchor="middle" font-size="12" fill="#222">POST /jobs/{id}/retry</text>
<line x1="450" y1="278" x2="750" y2="278" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="600.0" y="272" text-anchor="middle" font-size="12" fill="#222">re-queue job + audit entry, one tx</text>
<line x1="450" y1="312" x2="150" y2="312" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="300.0" y="306" text-anchor="middle" font-size="12" fill="#222">202 accepted</text>
<line x1="1050" y1="346" x2="750" y2="346" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="900.0" y="340" text-anchor="middle" font-size="12" fill="#222">claim job (SKIP LOCKED) and run it</text>
<line x1="150" y1="380" x2="450" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="300.0" y="374" text-anchor="middle" font-size="12" fill="#222">POST /users (invite)</text>
<line x1="450" y1="414" x2="750" y2="414" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="600.0" y="408" text-anchor="middle" font-size="12" fill="#222">insert user, membership, audit entry</text>
<line x1="450" y1="448" x2="150" y2="448" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="300.0" y="442" text-anchor="middle" font-size="12" fill="#222">201 created</text>
<line x1="150" y1="482" x2="450" y2="482" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="300.0" y="476" text-anchor="middle" font-size="12" fill="#222">PATCH /memberships/{id} (change role)</text>
<line x1="450" y1="516" x2="750" y2="516" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="600.0" y="510" text-anchor="middle" font-size="12" fill="#222">update role + audit entry</text>
<line x1="150" y1="550" x2="450" y2="550" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
<text x="300.0" y="544" text-anchor="middle" font-size="12" fill="#c0392b">GET /companies/{id}/settings</text>
<line x1="450" y1="584" x2="150" y2="584" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
<text x="300.0" y="578" text-anchor="middle" font-size="12" fill="#c0392b">200: tolerances, due date rule</text>
<line x1="150" y1="618" x2="450" y2="618" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
<text x="300.0" y="612" text-anchor="middle" font-size="12" fill="#c0392b">PATCH /companies/{id}/settings</text>
<line x1="450" y1="652" x2="750" y2="652" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
<text x="600.0" y="646" text-anchor="middle" font-size="12" fill="#c0392b">update tolerances + audit entry</text>
<line x1="450" y1="686" x2="150" y2="686" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
<text x="300.0" y="680" text-anchor="middle" font-size="12" fill="#c0392b">200 settings saved</text>
</svg>