# One command: docker compose up --build --wait
x-database: &database
  ConnectionStrings__Default: Host=postgres;Port=5432;Username=cfdi;Password=cfdi;Database=cfdi;GSS Encryption Mode=Disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cfdi
      POSTGRES_PASSWORD: cfdi
      POSTGRES_DB: cfdi
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cfdi -d cfdi']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., target: migrator }
    command: ['up']
    environment:
      <<: *database
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-synthetic-local-app-password}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: { context: ., target: api }
    environment:
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-synthetic-local-signing-key-at-least-32-bytes}
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=cfdi_app;Password=${APP_DB_PASSWORD:-synthetic-local-app-password};Database=cfdi;GSS Encryption Mode=Disable
    ports:
      - '127.0.0.1:8080:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: { context: ., target: worker }
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=cfdi_app;Password=${APP_DB_PASSWORD:-synthetic-local-app-password};Database=cfdi;GSS Encryption Mode=Disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12

  sat-stub:
    build: { context: ., target: sat-stub }
    ports:
      - '127.0.0.1:8081:8081'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8081/health >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
